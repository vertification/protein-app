name: 편의점 행사 수집

on:
  schedule:
    - cron: '17 21 * * 0'    # 매주 월요일 오전 6:17 (한국 시간)
    - cron: '17 0 1 * *'     # 매달 1일 오전 9:17 — 새 달 행사 반영
  workflow_dispatch:         # Actions 탭에서 "Run workflow"로 바로 실행

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 행사 수집
        run: node scripts/promo.mjs
      - name: 바뀐 내용 저장
        run: |
          git config user.name "promo-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add promo.json
          git diff --cached --quiet || (git commit -m "편의점 행사 갱신 $(TZ=Asia/Seoul date +%F)" && git push)

