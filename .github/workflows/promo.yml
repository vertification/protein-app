name: promo-collect

on:
  schedule:
    - cron: "17 21 * * 0"
    - cron: "17 0 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: collect
        run: node scripts/promo.mjs
      - name: save
        run: |
          git config user.name "promo-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add promo.json
          git diff --cached --quiet || (git commit -m "promo update" && git push)
